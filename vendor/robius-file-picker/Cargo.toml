[package]
name = "robius-file-picker"
version = "0.3.1"
edition = "2021"
rust-version = "1.88.0"
authors = [
    "Kevin Boos <kevinaboos@gmail.com>",
    "Project Robius Maintainers",
]
description = "Rust abstractions for showing native file and media pickers on multiple platforms"
documentation = "https://docs.rs/robius-file-picker"
homepage = "https://robius.rs/"
keywords = ["robius", "file", "picker", "dialog", "native"]
categories = ["os", "hardware-support", "api-bindings"]
license = "MIT"
repository = "https://github.com/project-robius/robius"
readme = "README.md"


## Note: ideally this would be only included when we're building for Android,
## but Cargo doesn't support target-specific build scripts yet.
## See: <https://github.com/rust-lang/cargo/issues/4932> and
## <https://github.com/rust-lang/cargo/issues/14378#issuecomment-2278333431>.
[build-dependencies]
android-build = "0.1.2"


[dependencies]
cfg-if = "1.0.0"
robius-common = { git = "https://github.com/project-robius/robius" }


[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
mime_guess = "2.0.5"
robius-android-env = "0.2.0"


[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.1"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std",
    "NSArray",
    "NSError",
    "NSItemProvider",
    "NSEnumerator",
    "NSObject",
    "NSProgress",
    "NSString",
    "NSURL",
    "block2",
] }
objc2-photos-ui = { version = "0.3.2", default-features = false, features = ["std","PHPicker"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std",
    "alloc",
    "block2",
    "UIApplication",
    "UIPresentationController",
    "UIDocumentPickerViewController",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std",
    "UTCoreTypes",
    "UTType",
] }


[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
robius-directories = { git = "https://github.com/project-robius/robius" }


## On macOS the native file panels must run on the main thread,
## which we accomplish via GCD (grand central dispatch).
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }

[workspace]
