[package]
name = "article-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host-independent article documents, editing state, assets and scoped storage"

[workspace]

[features]
default = []
l0 = ["dep:octoscript-ui-l0"]

[dependencies]
makepad-markdown = { git = "https://github.com/OctoSense-org/makepad", rev = "92a19b67218f8cd2361866c4554457b153766f48", features = ["editormd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
blake3 = "1.8"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = "0.13.0"
unicode-segmentation = "1.11.0"
url = "2.5.0"
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript", rev = "86a51a30767da5bf1f2e87559730f8539300b5d0", optional = true }

[dev-dependencies]
html5ever = "0.39.0"
